<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Distributed Inference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0E141B;
  --panel:#161F29;
  --raise:#1D2833;
  --edge:#263543;
  --signal:#56CFE1;
  --amber:#E9A15B;
  --text:#DDE6EF;
  --muted:#7B8C9E;
  --danger:#E5736B;
  --sans:"IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--ink);color:var(--text);font-family:var(--sans);
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

.app{display:grid;grid-template-columns:1fr 280px;height:100vh}

/* ── Center column ─────────────────────────────── */
.main{display:flex;flex-direction:column;min-width:0}

/* Signature: live pipeline strip */
.pipeline{
  border-bottom:1px solid var(--edge);background:var(--panel);
  padding:14px 24px;display:flex;align-items:center;gap:18px;
  overflow-x:auto;flex-shrink:0;
}
.pipeline-label{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap;
}
.stages{display:flex;align-items:stretch;gap:0;flex:1;min-width:0}
.stage{
  border:1px solid var(--edge);border-radius:3px;background:var(--raise);
  padding:7px 12px;min-width:132px;position:relative;flex-shrink:0;
}
.stage .role{
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);
}
.stage.master .role{color:var(--amber)}
.stage .ip{font-family:var(--mono);font-size:12.5px;color:var(--text);margin-top:1px}
.stage .layers{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px}
.link{
  align-self:center;width:34px;height:2px;background:var(--edge);
  position:relative;overflow:hidden;flex-shrink:0;
}
.streaming .link::after{
  content:"";position:absolute;inset:0;width:40%;
  background:linear-gradient(90deg,transparent,var(--signal),transparent);
  animation:flow 1.1s linear infinite;
}
.streaming .stage{border-color:#31485a}
@keyframes flow{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.pipeline-empty{font-family:var(--mono);font-size:12px;color:var(--muted)}

/* Messages */
.thread{flex:1;overflow-y:auto;padding:28px 24px 8px}
.thread-inner{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.msg{display:grid;grid-template-columns:60px 1fr;gap:16px;align-items:start}
.who{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);padding-top:4px;
}
.msg.assistant .who{color:var(--signal)}
.bubble{white-space:pre-wrap;word-wrap:break-word;min-width:0}
.bubble.pending::after{
  content:"";display:inline-block;width:7px;height:15px;
  background:var(--signal);vertical-align:-2px;margin-left:2px;
  animation:blink 1s step-end infinite;
}
@keyframes blink{50%{opacity:0}}
.err{color:var(--danger);font-family:var(--mono);font-size:13px}

.empty{
  text-align:center;color:var(--muted);padding:64px 0;
}
.empty h1{font-size:19px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty p{font-size:13.5px}

/* Composer */
.composer{padding:14px 24px 20px;flex-shrink:0}
.composer-inner{
  max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:flex-end;
  border:1px solid var(--edge);border-radius:4px;background:var(--panel);
  padding:10px 10px 10px 14px;
}
.composer-inner:focus-within{border-color:#38536a}
textarea{
  flex:1;background:none;border:0;resize:none;max-height:180px;
  min-height:24px;line-height:1.5;
}
textarea::placeholder{color:var(--muted)}
.send{
  background:var(--signal);color:#08131A;border:0;border-radius:3px;
  padding:7px 16px;font-weight:600;font-size:13.5px;cursor:pointer;
}
.send:hover:not(:disabled){filter:brightness(1.1)}
.send:disabled{background:var(--edge);color:var(--muted);cursor:not-allowed}
.meta{
  max-width:720px;margin:8px auto 0;display:flex;gap:14px;align-items:center;
  font-family:var(--mono);font-size:11px;color:var(--muted);
}
.meta select{
  background:var(--panel);border:1px solid var(--edge);border-radius:3px;
  padding:3px 6px;font-family:var(--mono);font-size:11px;
}

/* ── Right rail ────────────────────────────────── */
.rail{
  border-left:1px solid var(--edge);background:var(--panel);
  display:flex;flex-direction:column;min-width:0;
}
.rail-head{
  padding:16px;border-bottom:1px solid var(--edge);
  display:flex;align-items:center;justify-content:space-between;gap:8px;
}
.rail-head h2{
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--muted);font-weight:500;
}
.newbtn{
  background:none;border:1px solid var(--edge);border-radius:3px;
  color:var(--text);padding:3px 9px;font-size:12px;cursor:pointer;
}
.newbtn:hover{border-color:var(--signal);color:var(--signal)}
.sessions{flex:1;overflow-y:auto;padding:8px}
.sess{
  padding:9px 11px;border-radius:3px;cursor:pointer;margin-bottom:2px;
  border-left:2px solid transparent;
}
.sess:hover{background:var(--raise)}
.sess.active{background:var(--raise);border-left-color:var(--signal)}
.sess .title{
  font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.sess .sub{
  font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:2px;
  display:flex;justify-content:space-between;gap:8px;
}
.del{
  background:none;border:0;color:var(--muted);cursor:pointer;
  font-size:14px;line-height:1;padding:0 2px;
}
.del:hover{color:var(--danger)}
.rail-empty{color:var(--muted);font-size:13px;padding:16px;text-align:center}

@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div class="app">
  <div class="main">

    <!-- Signature element: live pipeline topology -->
    <div class="pipeline" id="pipeline">
      <span class="pipeline-label">Pipeline</span>
      <div class="stages" id="stages">
        <span class="pipeline-empty">Not built yet — send a message to start</span>
      </div>
    </div>

    <div class="thread" id="thread">
      <div class="thread-inner" id="threadInner"></div>
    </div>

    <div class="composer">
      <div class="composer-inner">
        <textarea id="input" rows="1" placeholder="Send a message…"></textarea>
        <button class="send" id="send">Send</button>
      </div>
      <div class="meta">
        <span>Model</span>
        <select id="model"></select>
        <span id="status"></span>
      </div>
    </div>
  </div>

  <aside class="rail">
    <div class="rail-head">
      <h2>Conversations</h2>
      <button class="newbtn" id="new">New</button>
    </div>
    <div class="sessions" id="sessions"></div>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);
let currentSession = null, busy = false;

const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ── Sessions ───────────────────────────────────
async function loadSessions(){
  const {sessions} = await (await fetch('/api/sessions')).json();
  const box = $('sessions');
  if(!sessions.length){
    box.innerHTML = '<div class="rail-empty">No conversations yet</div>';
    return;
  }
  box.innerHTML = '';
  for(const s of sessions){
    const el = document.createElement('div');
    el.className = 'sess' + (s.id === currentSession ? ' active' : '');
    el.innerHTML = `<div class="title">${esc(s.title)}</div>
      <div class="sub"><span>${esc(s.id)}</span>
      <span>${s.turns} turn${s.turns===1?'':'s'} <button class="del" title="Delete">×</button></span></div>`;
    el.onclick = e => {
      if(e.target.classList.contains('del')){
        e.stopPropagation();
        fetch('/api/sessions/'+encodeURIComponent(s.id), {method:'DELETE'})
          .then(() => { if(currentSession===s.id){currentSession=null; render([]);} loadSessions(); });
        return;
      }
      openSession(s.id);
    };
    box.appendChild(el);
  }
}

async function openSession(id){
  currentSession = id;
  const data = await (await fetch('/api/sessions/'+encodeURIComponent(id))).json();
  render(data.messages);
  loadSessions();
  refreshPipeline();
}

async function newSession(){
  const id = 'chat-' + Date.now().toString(36);
  await fetch('/api/sessions', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({id})
  });
  currentSession = id;
  render([]);
  loadSessions();
}

// ── Thread ─────────────────────────────────────
function render(messages){
  const box = $('threadInner');
  box.innerHTML = '';
  if(!messages.length){
    box.innerHTML = `<div class="empty"><h1>Ready when you are</h1>
      <p>Your prompt runs across every machine on the tailnet.</p></div>`;
    return;
  }
  for(const m of messages) addMsg(m.role, m.content);
}

function addMsg(role, text){
  const box = $('threadInner');
  box.querySelector('.empty')?.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.innerHTML = `<div class="who">${role === 'user' ? 'You' : 'Model'}</div>
                  <div class="bubble"></div>`;
  el.querySelector('.bubble').textContent = text;
  box.appendChild(el);
  $('thread').scrollTop = $('thread').scrollHeight;
  return el.querySelector('.bubble');
}

// ── Pipeline strip ─────────────────────────────
async function refreshPipeline(){
  const model = $('model').value;
  if(!model) return;
  const {pipeline, self_ip} = await (await fetch('/api/pipeline?model='+encodeURIComponent(model))).json();
  const box = $('stages');

  if(!pipeline){
    box.innerHTML = '<span class="pipeline-empty">Not built yet — send a message to start</span>';
    return;
  }
  if(pipeline.mode === 'local'){
    box.innerHTML = `<div class="stage master"><div class="role">Single node</div>
      <div class="ip">${esc(self_ip||'this machine')}</div>
      <div class="layers">all layers</div></div>`;
    return;
  }
  box.innerHTML = pipeline.stages.map((s,i) =>
    (i ? '<div class="link"></div>' : '') +
    `<div class="stage ${s.role}">
       <div class="role">${esc(s.role)}${s.ip===self_ip?' · this machine':''}</div>
       <div class="ip">${esc(s.ip)}</div>
       <div class="layers">layers ${s.layer_start}–${s.layer_end} · ${s.count}</div>
     </div>`
  ).join('');
}

// ── Send ───────────────────────────────────────
async function send(){
  const text = $('input').value.trim();
  if(!text || busy) return;
  if(!currentSession) await newSession();

  busy = true;
  $('send').disabled = true;
  $('input').value = '';
  $('input').style.height = 'auto';
  addMsg('user', text);

  const bubble = addMsg('assistant', '');
  bubble.classList.add('pending');
  $('pipeline').classList.add('streaming');
  $('status').textContent = 'generating…';

  try{
    const res = await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        session_id: currentSession,
        model: $('model').value,
        prompt: text,
        tokens: 200
      })
    });

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while(true){
      const {done, value} = await reader.read();
      if(done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n');
      buf = lines.pop();
      for(const line of lines){
        if(!line.trim()) continue;
        const msg = JSON.parse(line);
        if(msg.type === 'token'){
          bubble.textContent += msg.text;
          $('thread').scrollTop = $('thread').scrollHeight;
        }else if(msg.type === 'done'){
          if(msg.text) bubble.textContent = msg.text;
        }else if(msg.type === 'error'){
          bubble.classList.add('err');
          bubble.textContent = msg.message;
        }
      }
    }
  }catch(e){
    bubble.classList.add('err');
    bubble.textContent = 'Connection to the server was lost. Check the daemon is running.';
  }finally{
    bubble.classList.remove('pending');
    $('pipeline').classList.remove('streaming');
    $('status').textContent = '';
    $('send').disabled = false;
    busy = false;
    refreshPipeline();
    loadSessions();
  }
}

// ── Wiring ─────────────────────────────────────
$('send').onclick = send;
$('new').onclick = newSession;
$('input').addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }
});
$('input').addEventListener('input', e => {
  e.target.style.height = 'auto';
  e.target.style.height = Math.min(e.target.scrollHeight, 180) + 'px';
});
$('model').onchange = refreshPipeline;

(async function init(){
  const {models} = await (await fetch('/api/models')).json();
  $('model').innerHTML = models.length
    ? models.map(m => `<option>${esc(m)}</option>`).join('')
    : '<option>no models found</option>';
  await loadSessions();
  const {sessions} = await (await fetch('/api/sessions')).json();
  if(sessions.length) await openSession(sessions[0].id);
  else render([]);
  refreshPipeline();
})();
</script>
</body>
</html>
